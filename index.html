<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Practice App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .font-cert { font-family: 'Playfair Display', serif; }
        
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatA { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-18px) rotate(-6deg)} }
        @keyframes floatB { 0%,100%{transform:translateY(0) rotate(8deg)} 50%{transform:translateY(-24px) rotate(8deg)} }
        @keyframes floatC { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-14px) rotate(-3deg)} }
        @keyframes shimmer { 0%{background-position:200% center} 100%{background-position:-200% center} }

        .animate-fade-in { animation: fadeInScale 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .float-a { animation: floatA 4s ease-in-out infinite; }
        .float-b { animation: floatB 5.5s ease-in-out infinite; }
        .float-c { animation: floatC 3.8s ease-in-out infinite; }
        .shimmer-text {
            background: linear-gradient(90deg, #6366f1, #a78bfa, #818cf8, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite;
        }
        
        /* Custom scrollbar for mistakes list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #334155; }

        /* Certificate Gold Foil Effect */
        .gold-foil {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Safe area insets for notched phones */
        #app {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(0.5rem, env(safe-area-inset-left));
            padding-right: max(0.5rem, env(safe-area-inset-right));
        }

        /* Prevent text size inflation on iOS */
        html { -webkit-text-size-adjust: 100%; }

        /* Better touch targets — avoid tiny tap areas */
        button { touch-action: manipulation; }

        /* Smooth momentum scrolling on iOS */
        .overflow-y-auto { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 selection:bg-indigo-200 dark:selection:bg-indigo-500/30">

    <div id="app" class="min-h-screen flex flex-col items-center py-3 md:py-6 px-3 md:px-4">
        
        <!-- Navigation Bar -->
        <div class="w-full max-w-3xl flex justify-between items-center mb-4 md:mb-8 py-2.5 px-4 md:py-2 md:px-2 md:pl-6 rounded-full border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/60 backdrop-blur-md sticky top-2 md:top-4 z-50 shadow-sm shadow-slate-200/50 dark:shadow-black/20">
            <button data-action="go-intro" class="flex items-center hover:opacity-80 transition-opacity active:scale-95">
                <img src="logo.png" alt="Kana Master" class="h-10 md:h-12 w-auto object-contain mix-blend-multiply dark:mix-blend-lighten -ml-1 rounded-xl" />
            </button>
            
            <div class="flex items-center gap-1 md:gap-2" id="nav-actions">
                <!-- Nav buttons injected via JS -->
            </div>
        </div>

        <!-- Main Content Area -->
        <main id="main-content" class="w-full flex-1 flex flex-col justify-start md:justify-center">
            <!-- Dynamic content injected here -->
        </main>
    </div>

    <script>
        const hiraganaData = [
            { kana: 'あ', romaji: 'a' }, { kana: 'い', romaji: 'i' }, { kana: 'う', romaji: 'u' }, { kana: 'え', romaji: 'e' }, { kana: 'お', romaji: 'o' },

            { kana: 'ま', romaji: 'ma' }, { kana: 'み', romaji: 'mi' }, { kana: 'む', romaji: 'mu' }, { kana: 'め', romaji: 'me' }, { kana: 'も', romaji: 'mo' },
            { kana: 'や', romaji: 'ya' }, { kana: 'ゆ', romaji: 'yu' }, { kana: 'よ', romaji: 'yo' },
            { kana: 'ら', romaji: 'ra' }, { kana: 'り', romaji: 'ri' }, { kana: 'る', romaji: 'ru' }, { kana: 'れ', romaji: 're' }, { kana: 'ろ', romaji: 'ro' },
            { kana: 'わ', romaji: 'wa' }, { kana: 'を', romaji: 'wo' }, { kana: 'ん', romaji: 'n' },
            { kana: 'が', romaji: 'ga' }, { kana: 'ぎ', romaji: 'gi' }, { kana: 'ぐ', romaji: 'gu' }, { kana: 'げ', romaji: 'ge' }, { kana: 'ご', romaji: 'go' },
            { kana: 'ざ', romaji: 'za' }, { kana: 'じ', romaji: 'ji' }, { kana: 'ず', romaji: 'zu' }, { kana: 'ぜ', romaji: 'ze' }, { kana: 'ぞ', romaji: 'zo' },
            { kana: 'だ', romaji: 'da' }, { kana: 'ぢ', romaji: 'ji' }, { kana: 'づ', romaji: 'zu' }, { kana: 'で', romaji: 'de' }, { kana: 'ど', romaji: 'do' },
            { kana: 'ば', romaji: 'ba' }, { kana: 'び', romaji: 'bi' }, { kana: 'ぶ', romaji: 'bu' }, { kana: 'べ', romaji: 'be' }, { kana: 'ぼ', romaji: 'bo' },
            { kana: 'ぱ', romaji: 'pa' }, { kana: 'ぴ', romaji: 'pi' }, { kana: 'ぷ', romaji: 'pu' }, { kana: 'ぺ', romaji: 'pe' }, { kana: 'ぽ', romaji: 'po' }
        ];

        const katakanaData = [
            { kana: 'ア', romaji: 'a' }, { kana: 'イ', romaji: 'i' }, { kana: 'ウ', romaji: 'u' }, { kana: 'エ', romaji: 'e' }, { kana: 'オ', romaji: 'o' },
            { kana: 'カ', romaji: 'ka' }, { kana: 'キ', romaji: 'ki' }, { kana: 'ク', romaji: 'ku' }, { kana: 'ケ', romaji: 'ke' }, { kana: 'コ', romaji: 'ko' },
            { kana: 'サ', romaji: 'sa' }, { kana: 'シ', romaji: 'shi' }, { kana: 'ス', romaji: 'su' }, { kana: 'セ', romaji: 'se' }, { kana: 'ソ', romaji: 'so' },
            { kana: 'タ', romaji: 'ta' }, { kana: 'チ', romaji: 'chi' }, { kana: 'ツ', romaji: 'tsu' }, { kana: 'テ', romaji: 'te' }, { kana: 'ト', romaji: 'to' },
            { kana: 'ナ', romaji: 'na' }, { kana: 'ニ', romaji: 'ni' }, { kana: 'ヌ', romaji: 'nu' }, { kana: 'ネ', romaji: 'ne' }, { kana: 'ノ', romaji: 'no' },
            { kana: 'ハ', romaji: 'ha' }, { kana: 'ヒ', romaji: 'hi' }, { kana: 'フ', romaji: 'fu' }, { kana: 'ヘ', romaji: 'he' }, { kana: 'ホ', romaji: 'ho' },
            { kana: 'マ', romaji: 'ma' }, { kana: 'ミ', romaji: 'mi' }, { kana: 'ム', romaji: 'mu' }, { kana: 'メ', romaji: 'me' }, { kana: 'モ', romaji: 'mo' },
            { kana: 'ヤ', romaji: 'ya' }, { kana: 'ユ', romaji: 'yu' }, { kana: 'ヨ', romaji: 'yo' },
            { kana: 'ラ', romaji: 'ra' }, { kana: 'リ', romaji: 'ri' }, { kana: 'ル', romaji: 'ru' }, { kana: 'レ', romaji: 're' }, { kana: 'ロ', romaji: 'ro' },
            { kana: 'ワ', romaji: 'wa' }, { kana: 'ヲ', romaji: 'wo' }, { kana: 'ン', romaji: 'n' },
            { kana: 'ガ', romaji: 'ga' }, { kana: 'ギ', romaji: 'gi' }, { kana: 'グ', romaji: 'gu' }, { kana: 'ゲ', romaji: 'ge' }, { kana: 'ゴ', romaji: 'go' },
            { kana: 'ザ', romaji: 'za' }, { kana: 'ジ', romaji: 'ji' }, { kana: 'ズ', romaji: 'zu' }, { kana: 'ゼ', romaji: 'ze' }, { kana: 'ゾ', romaji: 'zo' },
            { kana: 'ダ', romaji: 'da' }, { kana: 'ヂ', romaji: 'ji' }, { kana: 'ヅ', romaji: 'zu' }, { kana: 'デ', romaji: 'de' }, { kana: 'ド', romaji: 'do' },
            { kana: 'バ', romaji: 'ba' }, { kana: 'ビ', romaji: 'bi' }, { kana: 'ブ', romaji: 'bu' }, { kana: 'ベ', romaji: 'be' }, { kana: 'ボ', romaji: 'bo' },
            { kana: 'パ', romaji: 'pa' }, { kana: 'ピ', romaji: 'pi' }, { kana: 'プ', romaji: 'pu' }, { kana: 'ペ', romaji: 'pe' }, { kana: 'ポ', romaji: 'po' }
        ];

        const hiraganaBasicGrid = [
            ['あ', 'い', 'う', 'え', 'お'], ['か', 'き', 'く', 'け', 'こ'], ['さ', 'し', 'す', 'せ', 'そ'],
            ['た', 'ち', 'つ', 'て', 'と'], ['な', 'に', 'ぬ', 'ね', 'の'], ['は', 'ひ', 'ふ', 'へ', 'ほ'],
            ['ま', 'み', 'む', 'め', 'も'], ['や', null, 'ゆ', null, 'よ'], ['ら', 'り', 'る', 'れ', 'ろ'],
            ['わ', null, null, null, 'を'], ['ん', null, null, null, null]
        ];
        const hiraganaModifiedGrid = [
            ['が', 'ぎ', 'ぐ', 'げ', 'ご'], ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'], ['だ', 'ぢ', 'づ', 'で', 'ど'],
            ['ば', 'び', 'ぶ', 'べ', 'ぼ'], ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ']
        ];
        const katakanaBasicGrid = [
            ['ア', 'イ', 'ウ', 'エ', 'オ'], ['カ', 'キ', 'ク', 'ケ', 'コ'], ['サ', 'シ', 'ス', 'セ', 'ソ'],
            ['タ', 'チ', 'ツ', 'テ', 'ト'], ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'], ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'],
            ['マ', 'ミ', 'ム', 'メ', 'モ'], ['ヤ', null, 'ユ', null, 'ヨ'], ['ラ', 'リ', 'ル', 'レ', 'ロ'],
            ['ワ', null, null, null, 'ヲ'], ['ン', null, null, null, null]
        ];
        const katakanaModifiedGrid = [
            ['ガ', 'ギ', 'グ', 'ゲ', 'ゴ'], ['ザ', 'ジ', 'ズ', 'ゼ', 'ゾ'], ['ダ', 'ヂ', 'ヅ', 'デ', 'ド'],
            ['バ', 'ビ', 'ブ', 'ベ', 'ボ'], ['パ', 'ピ', 'プ', 'ペ', 'ポ']
        ];

        const QUESTIONS_PER_SESSION = 20;
        const MASTERY_TARGET = 1;
        const STORAGE_KEY = 'kana_master_v1';

        let state = {
            theme: 'light',
            activeTab: 'practice',
            view: 'intro', // intro | setup | session | result | dashboard | certificate
            mode: 'mcq', // mcq | writing
            kanaSet: 'hiragana', // hiragana | katakana | both
            currentQuestion: null,
            mcqOptions: [],
            sessionData: { questionNumber: 0, score: 0, mistakes: [], startTime: 0, totalTimeTaken: 0 },
            stats: {}, // Map of character to { correct, wrong, time, attempts }
            feedback: null, // null | 'correct' | 'incorrect'
            writingInput: '',
            isProcessing: false,
            visualTime: 0,
            questionStartTime: 0,
            userName: '',       // For the certificate
            certEditingName: false // Whether the inline name editor is open
        };

        let timerInterval = null;
        let previousView = null;

        // ── Persistence ──────────────────────────────────────────────────────────
        function saveToStorage() {
            try {
                const data = {
                    stats:    state.stats,
                    userName: state.userName,
                    theme:    state.theme,
                    mode:     state.mode,
                    kanaSet:  state.kanaSet
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) { /* storage unavailable — silently ignore */ }
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.stats    && typeof data.stats === 'object') state.stats    = data.stats;
                if (data.userName && typeof data.userName === 'string') state.userName = data.userName;
                if (data.theme    === 'dark' || data.theme === 'light') state.theme   = data.theme;
                if (data.mode     === 'mcq'  || data.mode  === 'writing') state.mode  = data.mode;
                if (['hiragana','katakana','both'].includes(data.kanaSet)) state.kanaSet = data.kanaSet;
            } catch (e) { /* corrupt data — start fresh */ }
        }
        // ─────────────────────────────────────────────────────────────────────────

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function getActiveDataset() {
            if (state.kanaSet === 'hiragana') return hiraganaData;
            if (state.kanaSet === 'katakana') return katakanaData;
            return [...hiraganaData, ...katakanaData];
        }

        function getMasteryStats() {
            const allKana = [...hiraganaData, ...katakanaData];
            const totalMasteryPoints = allKana.length * MASTERY_TARGET;
            let currentMasteryPoints = 0;
            
            Object.values(state.stats).forEach(data => {
                currentMasteryPoints += Math.min(data.correct, MASTERY_TARGET);
            });
            return totalMasteryPoints === 0 ? 0 : Math.round((currentMasteryPoints / totalMasteryPoints) * 100);
        }

        function startSession() {
            state.sessionData = {
                questionNumber: 1,
                score: 0,
                mistakes: [],
                startTime: Date.now(),
                totalTimeTaken: 0
            };
            state.view = 'session';
            generateQuestion();
        }

        function generateQuestion() {
            const fullDataset = getActiveDataset();
            
            // Filter out mastered characters
            let eligibleDataset = fullDataset.filter(item => {
                const stat = state.stats[item.kana];
                return !stat || stat.correct < MASTERY_TARGET;
            });

            // If everything in this dataset is mastered, allow all of them for practice
            if (eligibleDataset.length === 0) {
                eligibleDataset = fullDataset; 
            }

            const randomIndex = Math.floor(Math.random() * eligibleDataset.length);
            const question = eligibleDataset[randomIndex];
            state.currentQuestion = question;

            if (state.mode === 'mcq') {
                const options = new Set([question.romaji]);
                while (options.size < 4) {
                    const randomDistractor = fullDataset[Math.floor(Math.random() * fullDataset.length)].romaji;
                    options.add(randomDistractor);
                }
                state.mcqOptions = shuffleArray(Array.from(options));
            }
            
            state.writingInput = '';
            state.feedback = null;
            state.isProcessing = false;
            state.questionStartTime = Date.now();
            state.visualTime = 0;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                state.visualTime = Math.floor((Date.now() - state.questionStartTime) / 1000);
                const timerEl = document.getElementById('visual-timer');
                if (timerEl) {
                    timerEl.innerText = state.visualTime + 's';
                    if (state.visualTime > 5) {
                        timerEl.classList.add('text-amber-600', 'dark:text-amber-400');
                        timerEl.classList.remove('text-slate-800', 'dark:text-slate-200');
                    }
                }
            }, 1000);
            
            render();
        }

        function handleAnswer(selectedRomaji) {
            if (state.isProcessing) return;
            state.isProcessing = true;
            clearInterval(timerInterval);

            const timeTaken = Date.now() - state.questionStartTime;
            const isCorrect = selectedRomaji.toLowerCase() === state.currentQuestion.romaji.toLowerCase();
            const kanaChar = state.currentQuestion.kana;
            
            if (!state.stats[kanaChar]) {
                state.stats[kanaChar] = { correct: 0, wrong: 0, time: 0, attempts: 0 };
            }
            
            const charStats = state.stats[kanaChar];
            charStats.attempts++;
            charStats.time += timeTaken;

            if (isCorrect) {
                charStats.correct++;
                state.feedback = 'correct';
                state.sessionData.score++;
            } else {
                charStats.wrong++;
                state.feedback = 'incorrect';
                state.sessionData.mistakes.push({ 
                    kana: kanaChar, 
                    expected: state.currentQuestion.romaji, 
                    answered: selectedRomaji || '(skipped)',
                    timeTaken
                });
            }

            render();
            saveToStorage(); // persist stats after every answer

            setTimeout(() => {
                if (state.sessionData.questionNumber >= QUESTIONS_PER_SESSION) {
                    state.sessionData.totalTimeTaken = Date.now() - state.sessionData.startTime;
                    state.view = 'result';
                } else {
                    state.sessionData.questionNumber++;
                    generateQuestion();
                    return; // generateQuestion handles the render
                }
                render();
            }, 1000);
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            saveToStorage();
            renderNav();
            lucide.createIcons();
        }

        function updateSetupUI() {
            document.querySelectorAll('[data-action="set-mode"]').forEach(btn => {
                const isSelected = btn.getAttribute('data-value') === state.mode;
                btn.className = `flex-1 py-2.5 text-sm md:text-base font-semibold rounded-lg transition-all ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'}`;
            });

            document.querySelectorAll('[data-action="set-kana"]').forEach(btn => {
                const isSelected = btn.getAttribute('data-value') === state.kanaSet;
                btn.className = `flex-1 py-2.5 text-xs md:text-sm font-semibold rounded-lg transition-all ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'}`;
            });
        }

        function renderNav() {
            const navBar = document.querySelector('#app > div:first-child');
            if (navBar) navBar.style.display = state.view === 'intro' ? 'none' : '';

            const nav = document.getElementById('nav-actions');
            const isSession = state.view === 'session';
            const disableClass = isSession ? 'opacity-50 pointer-events-none' : '';
            
            nav.innerHTML = `
                <button data-action="go-setup" class="flex items-center gap-1.5 md:gap-2 px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-bold transition-all 
                    ${state.activeTab === 'practice' && !isSession ? 'bg-slate-200 text-slate-900 dark:bg-slate-800 dark:text-white' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'} ${disableClass}">
                    <i data-lucide="home" class="w-3.5 h-3.5 md:w-4 md:h-4"></i> <span class="hidden sm:inline">Practice</span>
                </button>
                <button data-action="go-dashboard" class="flex items-center gap-1.5 md:gap-2 px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-bold transition-all 
                    ${state.activeTab === 'dashboard' ? 'bg-slate-200 text-slate-900 dark:bg-slate-800 dark:text-white' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'} ${disableClass}">
                    <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i> <span class="hidden sm:inline">Dashboard</span>
                </button>
                <div class="w-px h-6 mx-1 bg-slate-300 dark:bg-slate-800"></div>
                <button data-action="toggle-theme" title="Toggle Theme" class="p-1.5 md:p-2 rounded-full transition-colors text-slate-500 hover:text-indigo-600 hover:bg-slate-200 dark:text-slate-400 dark:hover:text-yellow-400 dark:hover:bg-slate-800">
                    <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-4 h-4 md:w-5 md:h-5"></i>
                </button>
            `;
        }

        function getIntroHTML() {
            return `
            <div class="w-full min-h-screen flex flex-col items-center animate-fade-in" style="margin-top: -1rem">

                <!-- Hero -->
                <div class="relative w-full flex flex-col items-center justify-center px-4 pt-14 pb-12 md:pt-24 md:pb-16 overflow-hidden">
                    <!-- Floating background kana -->
                    <div class="absolute inset-0 pointer-events-none select-none overflow-hidden">
                        <span class="absolute top-6 left-[8%]  text-6xl md:text-8xl font-black text-indigo-500/10 dark:text-indigo-400/10 float-a">あ</span>
                        <span class="absolute top-10 right-[10%] text-7xl md:text-9xl font-black text-purple-500/10 dark:text-purple-400/10 float-b">ア</span>
                        <span class="absolute bottom-8 left-[15%] text-5xl md:text-7xl font-black text-indigo-400/10 dark:text-indigo-300/10 float-c">か</span>
                        <span class="absolute bottom-4 right-[18%] text-6xl md:text-8xl font-black text-violet-500/10 dark:text-violet-400/10 float-a" style="animation-delay:1.2s">カ</span>
                        <span class="absolute top-1/2 left-[3%]  text-4xl font-black text-indigo-300/10 float-b" style="animation-delay:0.6s">の</span>
                        <span class="absolute top-1/3 right-[4%] text-5xl font-black text-purple-300/10 float-c" style="animation-delay:2s">ノ</span>
                    </div>

                const avgTime = data.attempts > 0 ? data.time / data.attempts : 0;
                const mastery = Math.min(data.correct, MASTERY_TARGET);
                return { kana, ...data, avgTime, mastery };
            });
            
            const hardest = [...statsList].filter(s => s.wrong > 0).sort((a, b) => b.wrong - a.wrong).slice(0, 5);
            const slowest = [...statsList].filter(s => s.attempts > 0).sort((a, b) => b.avgTime - a.avgTime).slice(0, 5);

            function generateGridSectionHTML(title, gridLayout, sourceData) {
                const cells = gridLayout.flat().map(kanaChar => {
                    if (!kanaChar) return `<div class="w-full aspect-square"></div>`;
                    
                    const dataItem = sourceData.find(d => d.kana === kanaChar);
                    const stat = state.stats[kanaChar];
                    const mastery = stat ? Math.min(stat.correct, MASTERY_TARGET) : 0;
                    
                    let bgClass = "bg-slate-100 text-slate-400 border border-slate-200 dark:bg-slate-800 dark:text-slate-600 dark:border-transparent";
                    if (stat && stat.wrong > 0 && mastery < MASTERY_TARGET) bgClass = "bg-rose-100 text-rose-700 border border-rose-300 dark:bg-rose-900/50 dark:text-rose-400 dark:border-rose-900/50";
                    if (mastery >= MASTERY_TARGET) bgClass = "bg-emerald-500 text-white shadow-sm shadow-emerald-500/30 dark:bg-emerald-600 dark:shadow-emerald-900/20";

                    return `<div title="${dataItem?.romaji || 'Unknown'}: ${mastery}/${MASTERY_TARGET} Mastered" 
                                class="w-full aspect-square rounded-lg flex items-center justify-center font-bold text-lg md:text-xl cursor-default transition-colors ${bgClass}">
                                ${kanaChar}
                            </div>`;
                }).join('');

                return `
                <div class="w-full flex-1">
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2.5 pl-2 border-l-2 border-indigo-500/50">${title}</h4>
                    <div class="grid grid-cols-5 gap-2 md:gap-2.5 w-full">${cells}</div>
                </div>`;
            }

            const hardestHTML = hardest.length === 0 ? 
                `<div class="text-center py-5 text-slate-400 text-xs">No mistakes yet!</div>` :
                `<div class="space-y-2.5">
                    ${hardest.map(item => `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="text-2xl font-black w-8 text-center text-slate-900 dark:text-white">${item.kana}</div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-500 uppercase font-bold">Errors</span>
                                    <span class="text-xs font-bold text-rose-600 dark:text-rose-400">${item.wrong}×</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>`;

            const slowestHTML = slowest.length === 0 ? 
                `<div class="text-center py-5 text-slate-400 text-xs">No data yet!</div>` :
                `<div class="space-y-2.5">
                    ${slowest.map(item => `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="text-2xl font-black w-8 text-center text-slate-900 dark:text-white">${item.kana}</div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-500 uppercase font-bold">Avg</span>
                                    <span class="text-xs font-bold text-amber-600 dark:text-amber-400">${(item.avgTime / 1000).toFixed(1)}s</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>`;

            const animClass = isNewView ? 'animate-fade-in' : '';

            return `
            <div class="w-full max-w-3xl mx-auto ${animClass} space-y-4 md:space-y-8 pb-10 px-0 md:px-4">
                
                <!-- Certificate Banner -->
                <div class="p-1 rounded-3xl bg-gradient-to-r from-amber-400 to-orange-500 shadow-xl shadow-orange-500/20">
                    <div class="bg-white/95 dark:bg-slate-900/95 rounded-[22px] p-4 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-amber-100 dark:bg-amber-900/50 flex items-center justify-center text-amber-600 dark:text-amber-400 flex-shrink-0">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-bold text-sm md:text-base text-slate-800 dark:text-slate-100 truncate">Kana Master Certificate</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
                                    ${masteryPercent === 100 ? 'You did it! Claim your reward.' : `${masteryPercent}% Completed. Keep going!`}
                                </p>
                            </div>
                        </div>
                        <button data-action="go-certificate" class="flex-shrink-0 px-4 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs md:text-sm font-bold rounded-xl shadow-lg hover:scale-105 transition-transform active:scale-95 whitespace-nowrap">
                            ${masteryPercent === 100 ? 'Claim Now' : 'Preview'}
                        </button>
                    </div>
                </div>

                <!-- Mastery Progress -->
                <div class="p-4 md:p-6 rounded-3xl border shadow-xl bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800">
                    <div class="flex items-center gap-3 mb-3 md:mb-4">
                        <i data-lucide="bar-chart" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                        <h2 class="text-base md:text-xl font-bold text-slate-900 dark:text-white">Global Progression</h2>
                    </div>
                    
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Mastery</span>
                        <span class="text-xl md:text-2xl font-black text-indigo-600 dark:text-indigo-400">${masteryPercent}%</span>
                    </div>
                    <div class="w-full h-3 rounded-full overflow-hidden border bg-slate-100 border-slate-200 dark:bg-slate-950 dark:border-slate-800">
                        <div class="h-full bg-gradient-to-r from-indigo-600 to-purple-500 rounded-full transition-all duration-1000 ease-out" style="width: ${masteryPercent}%"></div>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2 text-center">Answer each kana ${MASTERY_TARGET} times correctly to master it.</p>
                </div>

                <!-- Stats Grid — horizontal scroll on mobile so both cards are visible -->
                <div class="grid grid-cols-2 md:grid-cols-2 gap-3 md:gap-6">
                    <div class="p-4 md:p-6 rounded-3xl border shadow-xl bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800">
                        <div class="flex items-center gap-2 mb-3 md:mb-6 border-b pb-2.5 md:pb-3 border-slate-200 dark:border-slate-800">
                            <i data-lucide="x-circle" class="text-rose-500 w-4 h-4"></i>
                            <h3 class="font-bold text-xs md:text-base text-slate-800 dark:text-slate-200">Mistakes</h3>
                        </div>
                        ${hardestHTML}
                    </div>

                    <div class="p-4 md:p-6 rounded-3xl border shadow-xl bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800">
                        <div class="flex items-center gap-2 mb-3 md:mb-6 border-b pb-2.5 md:pb-3 border-slate-200 dark:border-slate-800">
                            <i data-lucide="clock" class="w-4 h-4 text-amber-600 dark:text-amber-500"></i>
                            <h3 class="font-bold text-xs md:text-base text-slate-800 dark:text-slate-200">Slowest</h3>
                        </div>
                        ${slowestHTML}
                    </div>
                </div>

                <!-- Full Mastery Grid -->
                <div class="p-4 md:p-6 rounded-3xl border shadow-xl bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800">
                    <h3 class="font-bold mb-4 md:mb-6 flex items-center gap-2 border-b pb-3 text-sm md:text-base text-slate-800 border-slate-200 dark:text-slate-200 dark:border-slate-800">
                       <i data-lucide="grid" class="w-4 h-4 md:w-5 md:h-5 text-emerald-600 dark:text-emerald-400"></i> Kana Grid
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 md:gap-x-8 gap-y-6 md:gap-y-10 w-full">
                        ${generateGridSectionHTML('Basic Hiragana', hiraganaBasicGrid, hiraganaData)}
                        ${generateGridSectionHTML('Modified Hiragana', hiraganaModifiedGrid, hiraganaData)}
                        ${generateGridSectionHTML('Basic Katakana', katakanaBasicGrid, katakanaData)}
                        ${generateGridSectionHTML('Modified Katakana', katakanaModifiedGrid, katakanaData)}
                    </div>
                </div>
            </div>`;
        }

        function getCertificateHTML(isNewView) {
            const animClass = isNewView ? 'animate-fade-in' : '';
            const percent = getMasteryStats();
            const isEligible = percent === 100;
            const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const displayName = state.userName || 'Your Name';
            const isEditingName = state.certEditingName;

            // Locked overlay
            const lockedOverlay = !isEligible ? `
                <div class="absolute inset-0 z-20 flex flex-col items-center justify-center rounded-xl" style="background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(4px);">
                    <div class="text-center px-6">
                        <div class="text-4xl mb-3">📜</div>
                        <p class="font-black text-slate-800 text-lg mb-1">Training Incomplete</p>
                        <p class="text-slate-600 text-sm">You're at <span class="font-bold text-slate-800">${percent}%</span> mastery.</p>
                        <p class="text-slate-500 text-xs mt-1">Master all kana to unlock your certificate.</p>
                        <div class="mt-4 w-full max-w-[180px] mx-auto h-2 rounded-full bg-slate-200 overflow-hidden border border-slate-300">
                            <div class="h-full bg-indigo-500 rounded-full" style="width: ${percent}%"></div>
                        </div>
                        <p class="text-slate-500 text-xs mt-1.5 font-bold">${percent}% / 100%</p>
                    </div>
                </div>` : '';

            // Name section
            const nameSection = isEligible ? (
                isEditingName ? `
                <div class="py-5 border-y border-indigo-900/10">
                    <p class="text-xs text-slate-500 mb-2 font-serif">This certifies that</p>
                    <input id="cert-name-input" type="text" value="${state.userName || ''}" placeholder="Enter your name" maxlength="30"
                        autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
                        class="w-full bg-transparent border-b-2 border-indigo-600 outline-none text-2xl md:text-4xl font-cert font-bold text-slate-900 tracking-wide text-center pb-1 placeholder:text-slate-300 placeholder:text-xl" />
                    <button data-action="save-cert-name" class="mt-4 px-6 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold uppercase tracking-widest rounded transition-colors active:scale-95">Save</button>
                </div>` : `
                <div class="py-5 border-y border-indigo-900/10 cursor-pointer group" data-action="edit-cert-name">
                    <p class="text-xs text-slate-500 mb-1 font-serif">This certifies that</p>
                    <p class="text-3xl md:text-5xl font-cert font-bold tracking-wide break-words group-hover:text-indigo-800 transition-colors ${displayName === 'Your Name' ? 'text-slate-300 italic' : 'text-slate-900'}">${displayName}</p>
                </div>`) : `
                <div class="py-5 border-y border-indigo-900/10">
                    <p class="text-xs text-slate-500 mb-1 font-serif">This certifies that</p>
                    <p class="text-3xl md:text-5xl font-cert font-bold text-slate-300 italic tracking-wide">Your Name</p>
                </div>`;

            return `
            <div class="w-full max-w-lg mx-auto ${animClass} px-1 pb-12">
                ${isEligible
                    ? `<p class="text-center text-xs font-medium text-slate-500 dark:text-slate-400 mb-3">📜 Download and share your official certificate</p>`
                    : `<p class="text-center text-xs font-medium text-indigo-600 dark:text-indigo-500 mb-3">🎯 Master all kana to receive your certificate!</p>`}

                <!-- The Certificate Card -->
                <div id="certificate-card" class="relative overflow-hidden mb-5 bg-[#fdfbf7]"
                    style="border-radius: 8px; border: 6px solid #3730a3; box-shadow: 0 10px 40px rgba(0,0,0,0.1), inset 0 0 20px rgba(55,48,163,0.05); min-height: clamp(360px, 65vw, 560px);">

                    <!-- Traditional inner border lines -->
                    <div class="absolute inset-1 border-[1px] border-indigo-800/40 pointer-events-none"></div>
                    <div class="absolute inset-[6px] border-[2px] border-indigo-800/30 pointer-events-none"></div>

                    <!-- Large faint watermark kanji (証 - Shou / Proof / Certificate) -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none overflow-hidden">
                        <span class="text-[18rem] font-serif text-indigo-900 font-bold opacity-[0.03]">証</span>
                    </div>

                    ${lockedOverlay}

                    <!-- Certificate Content -->
                    <div class="relative z-10 flex flex-col justify-between text-center px-8 py-8 md:px-12 md:py-10" style="min-height: clamp(360px, 65vw, 560px);">

                        <!-- Header -->
                        <div>
                            <p class="text-[9px] md:text-[10px] font-bold tracking-[0.3em] uppercase text-indigo-800 mb-2">Certificate of Merit</p>
                            
                            <!-- Japanese Title -->
                            <h2 class="text-4xl md:text-5xl font-serif font-black text-slate-900 tracking-[0.2em] ml-[0.2em]">賞状</h2>
                            
                            <p class="text-[10px] md:text-xs font-bold tracking-[0.3em] uppercase text-slate-600 mt-2 mb-4">Kana Master</p>

                            <!-- Ornamental line -->
                            <div class="flex items-center gap-2 mb-4">
                                <div class="flex-1 h-[2px] bg-gradient-to-r from-transparent via-indigo-900/30 to-transparent"></div>
                            </div>
                        </div>

                        <!-- Name Section -->
                        ${nameSection}

                        <!-- Body & Footer -->
                        <div>
                            <p class="text-xs md:text-sm text-slate-700 mb-5 px-2 font-serif leading-relaxed">
                                Is hereby awarded this certificate in recognition of achieving
                                <span class="text-indigo-700 font-bold">100% Mastery</span>
                                of the Japanese Hiragana and Katakana writing systems.
                            </p>

                            <div class="flex justify-between items-end mt-6">
                                <div class="text-left">
                                    <p class="text-[9px] text-slate-400 uppercase tracking-widest mb-1">Awarded On</p>
                                    <p class="text-xs font-bold text-slate-800 border-b border-slate-300 pb-0.5">${dateStr}</p>
                                </div>

                                <!-- Traditional Square Hanko (Seal) matched to theme -->
                                <div class="flex flex-col items-center justify-center w-12 h-12 md:w-14 md:h-14 rounded-md shadow-sm"
                                    style="border: 3px solid ${isEligible ? 'rgba(79,70,229,0.85)' : 'rgba(203,213,225,0.8)'}; color: ${isEligible ? 'rgba(79,70,229,0.85)' : 'rgba(203,213,225,0.8)'};">
                                    <span class="text-sm md:text-base font-black font-serif leading-none tracking-widest">合<br>格</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col gap-2.5">
                    ${isEligible && !isEditingName ? `
                    <button data-action="edit-cert-name" class="w-full py-3 border border-slate-300 hover:border-slate-400 dark:border-slate-700 dark:hover:border-slate-500 text-slate-600 dark:text-slate-300 font-bold rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95 bg-slate-50/50 hover:bg-slate-100 dark:bg-slate-800/50 dark:hover:bg-slate-800">
                        <i data-lucide="pencil" class="w-4 h-4"></i> Edit Name on Certificate
                    </button>` : ''}
                    ${isEligible ? `
                    <button data-action="download-cert" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-900/20 flex items-center justify-center gap-2 active:scale-95">
                        <i data-lucide="download" class="w-5 h-5"></i> Download Certificate (PNG)
                    </button>` : `
                    <button data-action="go-setup" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2 active:scale-95">
                        <i data-lucide="play" class="w-5 h-5"></i> Keep Practicing
                    </button>`}
                    <button data-action="go-dashboard" class="w-full py-3.5 font-bold rounded-xl transition-colors bg-slate-100 hover:bg-slate-200 text-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300">
                        Back to Dashboard
                    </button>
                </div>

                <!-- Toast -->
                <div id="toast-msg" class="hidden opacity-0 transition-opacity duration-300 mt-4 p-3 rounded-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-400 text-sm font-bold text-center"></div>
            </div>`;
        }

        // ── Hash Routing ──────────────────────────────────────────────────────────

        const VIEW_TO_HASH = {
            intro:       '',
            setup:       '#practice',
            dashboard:   '#dashboard',
            certificate: '#certificate',
            session:     '#session',
            result:      '#result'
        };
        const HASH_TO_VIEW = {
            '':             'intro',
            '#practice':    'setup',
            '#dashboard':   'dashboard',
            '#certificate': 'certificate'
            // #session and #result are NOT restored — they redirect to safe views
        };

        function getViewFromHash() {
            const hash = window.location.hash || '';
            if (HASH_TO_VIEW[hash] !== undefined) return HASH_TO_VIEW[hash];
            if (hash === '#session' || hash === '#result') return 'setup'; // can't resume
            return 'intro';
        }
        // ─────────────────────────────────────────────────────────────────────────

        function render() {
            renderNav();
            const main = document.getElementById('main-content');
            const isNewView = previousView !== state.view;
            
            if (state.view === 'intro') main.innerHTML = getIntroHTML();
            else if (state.view === 'setup') main.innerHTML = getSetupHTML(isNewView);
            else if (state.view === 'session') main.innerHTML = getSessionHTML(isNewView);
            else if (state.view === 'result') main.innerHTML = getResultHTML(isNewView);
            else if (state.view === 'dashboard') main.innerHTML = getDashboardHTML(isNewView);
            else if (state.view === 'certificate') main.innerHTML = getCertificateHTML(isNewView);

            // Sync URL hash with current view (without triggering hashchange)
            const targetHash = VIEW_TO_HASH[state.view] ?? '';
            if (window.location.hash !== targetHash) {
                history.pushState(null, '', targetHash || window.location.pathname);
            }
            
            previousView = state.view;
            lucide.createIcons();

            if (state.view === 'session' && state.mode === 'writing' && !state.isProcessing) {
                const input = document.getElementById('writing-input');
                if (input) setTimeout(() => input.focus(), 10);
            }
            if (state.view === 'certificate' && state.certEditingName) {
                const input = document.getElementById('cert-name-input');
                if (input) setTimeout(() => { input.focus(); input.select(); }, 10);
            }
        }

        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            
            const action = target.getAttribute('data-action');
            const value = target.getAttribute('data-value');
            
            if (action === 'set-mode') { state.mode = value; updateSetupUI(); }
            else if (action === 'set-kana') { state.kanaSet = value; updateSetupUI(); }
            else if (action === 'start-session') { startSession(); }
            else if (action === 'answer-mcq') { handleAnswer(value); }
            else if (action === 'skip-writing') { handleAnswer(''); }
            else if (action === 'go-intro') { state.view = 'intro'; state.activeTab = 'practice'; render(); }
            else if (action === 'go-setup') { state.view = 'setup'; state.activeTab = 'practice'; render(); }
            else if (action === 'go-dashboard') { state.view = 'dashboard'; state.activeTab = 'dashboard'; render(); }
            else if (action === 'go-certificate') { state.view = 'certificate'; state.certEditingName = false; render(); }
            else if (action === 'toggle-theme') { toggleTheme(); }
            else if (action === 'edit-cert-name') {
                state.certEditingName = true;
                render();
            }
            else if (action === 'save-cert-name') {
                const nameInput = document.getElementById('cert-name-input');
                if (nameInput) state.userName = nameInput.value.trim() || state.userName;
                state.certEditingName = false;
                saveToStorage();
                render();
            }
            else if (action === 'download-cert') {
                const btn = target;
                const originalContent = btn.innerHTML;
                const toast = document.getElementById('toast-msg');
                
                // Show loading state
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Generating PNG...`;
                btn.disabled = true;
                lucide.createIcons();
                
                const certCard = document.getElementById('certificate-card');
                
                // Use html2canvas to capture the certificate
                setTimeout(() => {
                    html2canvas(certCard, {
                        scale: window.devicePixelRatio > 1 ? window.devicePixelRatio : 2,
                        backgroundColor: null,
                        useCORS: true,
                        logging: false
                    }).then(canvas => {
                        const link = document.createElement('a');
                        const cleanName = (state.userName || 'Kana_Master').replace(/\s+/g, '_');
                        link.download = `Certificate_${cleanName}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        
                        toast.innerText = "Certificate downloaded successfully! 🌸";
                        toast.classList.remove('hidden');
                        void toast.offsetWidth;
                        toast.classList.remove('opacity-0');
                        
                        setTimeout(() => {
                            toast.classList.add('opacity-0');
                            setTimeout(() => toast.classList.add('hidden'), 300);
                        }, 4000);
                    }).catch(err => {
                        console.error('Error generating PNG:', err);
                        toast.innerText = "Failed to generate PNG. Please take a screenshot.";
                        toast.classList.remove('hidden');
                        void toast.offsetWidth;
                        toast.classList.remove('opacity-0');
                        
                        setTimeout(() => {
                            toast.classList.add('opacity-0');
                            setTimeout(() => toast.classList.add('hidden'), 300);
                        }, 4000);
                    }).finally(() => {
                        // Restore button
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                        lucide.createIcons();
                    });
                }, 100);
            }
        });

        // Form submits for writing inputs
        document.addEventListener('submit', (e) => {
            e.preventDefault();
            if (e.target.id === 'writing-form') {
                const input = document.getElementById('writing-input');
                if (input && input.value.trim() && !state.isProcessing) {
                    handleAnswer(input.value.trim());
                }
            }
        });

        // Sync writing input to state as user types
        document.addEventListener('input', (e) => {
            if (e.target.id === 'writing-input') {
                state.writingInput = e.target.value;
            }
        });

        // Allow Enter to save name on certificate
        document.addEventListener('keydown', (e) => {
            if (e.target.id === 'cert-name-input' && e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) state.userName = val;
                state.certEditingName = false;
                saveToStorage();
                render();
            }
        });

        // ── TEST DATA (remove when done) ──────────────────────────────────────
        (function injectTestData() {
            const allKana = [
                'あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ',
                'た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
                'ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん',
                'が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど',
                'ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ',
                'ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ','サ','シ','ス','セ','ソ',
                'タ','チ','ツ','テ','ト','ナ','ニ','ヌ','ネ','ノ','ハ','ヒ','フ','ヘ','ホ',
                'マ','ミ','ム','メ','モ','ヤ','ユ','ヨ','ラ','リ','ル','レ','ロ','ワ','ヲ','ン',
                'ガ','ギ','グ','ゲ','ゴ','ザ','ジ','ズ','ゼ','ゾ','ダ','ヂ','ヅ','デ','ド',
                'バ','ビ','ブ','ベ','ボ','パ','ピ','プ','ペ','ポ'
            ];
            const stats = {};
            allKana.forEach(k => { stats[k] = { correct: 3, wrong: 1, time: 15000, attempts: 4 }; });
            localStorage.setItem('kana_master_v1', JSON.stringify({
                stats, userName: '', theme: 'light', mode: 'mcq', kanaSet: 'both'
            }));
        })();
        // ─────────────────────────────────────────────────────────────────────────

        // Initialize App
        loadFromStorage(); // restore saved progress before first render
        if (state.theme === 'dark') document.documentElement.classList.add('dark');

        // Restore view from URL hash on load
        const viewFromHash = getViewFromHash();
        if (viewFromHash !== 'intro') {
            state.view = viewFromHash;
            if (viewFromHash === 'dashboard') state.activeTab = 'dashboard';
            if (viewFromHash === 'setup')     state.activeTab = 'practice';
        }
        render();

        // Browser back/forward button support
        window.addEventListener('popstate', () => {
            const v = getViewFromHash();
            state.view = v;
            state.activeTab = v === 'dashboard' ? 'dashboard' : 'practice';
            render();
        });

    </script>
</body>
</html>
